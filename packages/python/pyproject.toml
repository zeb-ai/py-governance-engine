[build-system]
requires = ["setuptools>=82.0.1", "cffi>=2.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "z-grc"
version = "0.0.41"
description = "Governance Engine by zeb labs"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Samrat Damodaran", email = "samrat.damodaran@zeb.co" }
]
dependencies = [
    "cffi>=2.0.0",
]


[tool.setuptools]
py-modules = ["core_build"]

[tool.setuptools.packages.find]
include = ["zgrc*"]
exclude = ["zgrc.__pycache__*", "zgrc.core.__pycache__*", "zgrc.utils.__pycache__*"]

[tool.setuptools.package-data]
"zgrc" = ["_native*.so", "_native*.pyd", "data/*.json"]
