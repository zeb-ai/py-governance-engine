name: Build Python wheels

on:
  push:
    branches: [main]
    paths:
      - "packages/python/pyproject.toml"
  workflow_dispatch:

jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            cibw_archs: arm64
          - os: macos-15-intel
            cibw_archs: x86_64
          - os: ubuntu-22.04
            cibw_archs: x86_64
          - os: ubuntu-22.04-arm
            cibw_archs: aarch64
          - os: windows-2022
            cibw_archs: AMD64
          - os: windows-2022
            cibw_archs: ARM64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.21.3

      - name: Vendor C sources
        run: python -c "import os, shutil; root=os.path.abspath(os.path.join('..','..')); csrc=os.path.abspath('csrc'); ignore=shutil.ignore_patterns('*.o','*.obj','*.d','build','.DS_Store','main.c'); [shutil.copytree(os.path.join(root,d),os.path.join(csrc,d),ignore=ignore) for d in ['src','include',os.path.join('lib','yyjson'),os.path.join('lib','libb64')] if os.path.isdir(os.path.join(root,d)) and not os.path.isdir(os.path.join(csrc,d))]"

      - name: Build wheels
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_BUILD: "cp312-* cp313-*"
          CIBW_BUILD_VERBOSITY: "3"
          CIBW_SKIP: "*-musllinux_*"

          # Install curl dev headers so the C extension can compile.
          # manylinux2014 is CentOS 7 (EOL) where the EPEL metalink can fail;
          # libcurl-devel is in base, so disable EPEL to avoid the failure.
          CIBW_BEFORE_ALL_LINUX: >
            yum install -y --disablerepo=epel libcurl-devel ||
            apt-get install -y libcurl4-openssl-dev

          CIBW_BEFORE_ALL_WINDOWS: >
            cd /d %TEMP% &&
            curl -sL https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz -o zlib.tar.gz &&
            tar xzf zlib.tar.gz &&
            cd zlib-1.3.1 &&
            cmake -B build -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=C:/deps -A %CMAKE_ARCH% &&
            cmake --build build --config Release &&
            cmake --install build --config Release &&
            cd /d %TEMP% &&
            curl -sL https://github.com/curl/curl/releases/download/curl-8_11_1/curl-8.11.1.tar.gz -o curl.tar.gz &&
            tar xzf curl.tar.gz &&
            cd curl-8.11.1 &&
            cmake -B build -DBUILD_SHARED_LIBS=OFF -DCURL_USE_SCHANNEL=ON -DHTTP_ONLY=ON -DZLIB_ROOT=C:/deps -DCMAKE_INSTALL_PREFIX=C:/deps -A %CMAKE_ARCH% &&
            cmake --build build --config Release &&
            cmake --install build --config Release &&
            dir C:\deps\lib\

          CIBW_ENVIRONMENT_WINDOWS: >
            ZGRC_DEPS_DIR="C:/deps" CMAKE_ARCH="${{ matrix.cibw_archs == 'ARM64' && 'ARM64' || 'x64' }}"

        run: cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.cibw_archs }}
          path: packages/python/wheelhouse/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: packages/python/dist/*.tar.gz

  publish:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    defaults:
      run:
        working-directory: packages/python

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install

      - name: Get version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git tag | grep -q "^v${{ steps.get_version.outputs.version }}$"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Git tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "v${{ steps.get_version.outputs.version }}"
          git push origin "v${{ steps.get_version.outputs.version }}"

      - uses: actions/download-artifact@v4
        if: steps.check_tag.outputs.exists == 'false'
        with:
          path: dist/
          pattern: wheel-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        if: steps.check_tag.outputs.exists == 'false'
        with:
          name: sdist
          path: dist/

      - name: Publish to PyPI
        if: steps.check_tag.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
