name: Build Python wheels

on:
  push:
    branches: [main]
    paths:
      - "packages/python/pyproject.toml"
  workflow_dispatch:

jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            cibw_archs: arm64
          - os: macos-15-intel
            cibw_archs: x86_64
          - os: ubuntu-22.04
            cibw_archs: x86_64
          - os: ubuntu-22.04-arm
            cibw_archs: aarch64
          - os: windows-latest
            cibw_archs: AMD64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.21.3

      - name: Vendor C sources
        run: python -c "import os, shutil; root=os.path.abspath(os.path.join('..','..')); csrc=os.path.abspath('csrc'); ignore=shutil.ignore_patterns('*.o','*.obj','*.d','build','.DS_Store','main.c'); [shutil.copytree(os.path.join(root,d),os.path.join(csrc,d),ignore=ignore) for d in ['src','include',os.path.join('lib','yyjson'),os.path.join('lib','libb64')] if os.path.isdir(os.path.join(root,d)) and not os.path.isdir(os.path.join(csrc,d))]"

      - name: Build wheels
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_BUILD: "cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"

          # Install curl dev headers so the C extension can compile
          CIBW_BEFORE_ALL_LINUX: >
            yum install -y libcurl-devel ||
            apt-get install -y libcurl4-openssl-dev

          CIBW_BEFORE_ALL_WINDOWS: >
            cd /d %TEMP% &&
            curl -sL https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz -o zlib.tar.gz &&
            tar xzf zlib.tar.gz &&
            cd zlib-1.3.1 &&
            cmake -B build -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=C:/deps &&
            cmake --build build --config Release &&
            cmake --install build --config Release &&
            cd /d %TEMP% &&
            curl -sL https://github.com/curl/curl/releases/download/curl-8_11_1/curl-8.11.1.tar.gz -o curl.tar.gz &&
            tar xzf curl.tar.gz &&
            cd curl-8.11.1 &&
            cmake -B build -DBUILD_SHARED_LIBS=OFF -DCURL_USE_SCHANNEL=ON -DHTTP_ONLY=ON -DZLIB_ROOT=C:/deps -DCMAKE_INSTALL_PREFIX=C:/deps &&
            cmake --build build --config Release &&
            cmake --install build --config Release

          CIBW_ENVIRONMENT_WINDOWS: >
            ZGRC_DEPS_DIR="C:/deps"

        run: cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.cibw_archs }}
          path: packages/python/wheelhouse/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: packages/python/dist/*.tar.gz

  publish:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: wheel-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
