name: Build Node.js prebuilds

on:
  push:
    branches: [main]
    paths:
      - "packages/node/package.json"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
          - os: windows-latest
            platform: win32
            arch: arm64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/node

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts # skip postinstall/prepare hooks; prebuildify runs explicitly below

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Build static curl (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          DEPS_DIR=$PWD/deps

          # Static libs linked into a .node shared object need PIC on Linux
          if [ "$(uname)" = "Linux" ]; then
            export CFLAGS="-fPIC"
          fi

          # Build zlib static
          cd /tmp
          curl -sL https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz | tar xz
          cd zlib-1.3.1
          ./configure --static --prefix=$DEPS_DIR
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make install

          # On macOS, Homebrew OpenSSL is not in pkg-config path by default.
          SSL_ARG="--with-ssl"
          if [ "$(uname)" = "Darwin" ]; then
            OPENSSL_PREFIX=$(brew --prefix openssl@3)
            SSL_ARG="--with-ssl=$OPENSSL_PREFIX"
          fi

          # Build curl static (minimal — HTTPS only)
          cd /tmp
          curl -sL https://github.com/curl/curl/releases/download/curl-8_11_1/curl-8.11.1.tar.gz | tar xz
          cd curl-8.11.1
          ./configure \
            --prefix=$DEPS_DIR \
            --disable-shared --enable-static \
            --with-pic \
            --disable-ftp --disable-ldap --disable-dict \
            --disable-telnet --disable-tftp --disable-pop3 \
            --disable-imap --disable-smb --disable-smtp \
            --disable-gopher --disable-rtsp --disable-mqtt \
            --without-libpsl --without-brotli --without-zstd \
            --without-libidn2 --without-nghttp2 \
            $SSL_ARG --with-zlib=$DEPS_DIR
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make install

          # Copy OpenSSL static libs into deps/lib for node-gyp linking
          if [ "$(uname)" = "Darwin" ]; then
            cp "$OPENSSL_PREFIX/lib/libssl.a" "$DEPS_DIR/lib/"
            cp "$OPENSSL_PREFIX/lib/libcrypto.a" "$DEPS_DIR/lib/"
          else
            cp /usr/lib/$(uname -m)-linux-gnu/libssl.a "$DEPS_DIR/lib/" 2>/dev/null || \
              cp /usr/lib/libssl.a "$DEPS_DIR/lib/"
            cp /usr/lib/$(uname -m)-linux-gnu/libcrypto.a "$DEPS_DIR/lib/" 2>/dev/null || \
              cp /usr/lib/libcrypto.a "$DEPS_DIR/lib/"
          fi

      - name: Build static curl (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $DEPS_DIR = "$PWD\deps"
          $CMAKE_ARCH = if ("${{ matrix.arch }}" -eq "arm64") { "ARM64" } else { "x64" }

          # Build zlib
          cd $env:TEMP
          Invoke-WebRequest -Uri "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz" -OutFile zlib.tar.gz
          tar xzf zlib.tar.gz
          cd zlib-1.3.1
          cmake -B build -DCMAKE_INSTALL_PREFIX="$DEPS_DIR" -DBUILD_SHARED_LIBS=OFF -A $CMAKE_ARCH
          cmake --build build --config Release
          cmake --install build --config Release

          # Build curl
          cd $env:TEMP
          Invoke-WebRequest -Uri "https://github.com/curl/curl/releases/download/curl-8_11_1/curl-8.11.1.tar.gz" -OutFile curl.tar.gz
          tar xzf curl.tar.gz
          cd curl-8.11.1
          cmake -B build `
            -DCMAKE_INSTALL_PREFIX="$DEPS_DIR" `
            -DBUILD_SHARED_LIBS=OFF `
            -DCURL_USE_SCHANNEL=ON `
            -DHTTP_ONLY=ON `
            -DCURL_ZLIB=ON `
            -DZLIB_ROOT="$DEPS_DIR" `
            -A $CMAKE_ARCH
          cmake --build build --config Release
          cmake --install build --config Release

      - name: Vendor C sources
        run: node scripts/vendor.js

      - name: Build prebuild (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          DEPS_DIR: ${{ github.workspace }}/packages/node/deps
        run: |
          npx prebuildify --napi --strip \
            --cflags="-I$DEPS_DIR/include" \
            --ldflags="-L$DEPS_DIR/lib -lcurl -lssl -lcrypto -lz -framework Security -framework SystemConfiguration"

      - name: Build prebuild (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          DEPS_DIR: ${{ github.workspace }}/packages/node/deps
        run: |
          npx prebuildify --napi --strip \
            --cflags="-I$DEPS_DIR/include" \
            --ldflags="-L$DEPS_DIR/lib -lcurl -lssl -lcrypto -lz -static-libgcc"

      - name: Build prebuild (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: npx prebuildify --napi --strip --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/node/prebuilds/

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/node

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: packages/node/prebuilds/
          pattern: prebuild-*
          merge-multiple: true

      - name: Vendor sources and data
        run: node scripts/vendor.js

      - name: List prebuilds
        run: find prebuilds -type f

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git tag | grep -q "^node-v${{ steps.get_version.outputs.version }}$"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Git tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "node-v${{ steps.get_version.outputs.version }}"
          git push origin "node-v${{ steps.get_version.outputs.version }}"

      - name: Publish to npm
        if: steps.check_tag.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --access public
