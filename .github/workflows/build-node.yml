name: Build Node.js prebuilds

on:
  push:
    branches: [main]
    paths:
      - "packages/node/package.json"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
          - os: windows-2022
            platform: win32
            arch: x64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/node

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts # skip postinstall/prepare hooks; prebuildify runs explicitly below

      - name: Build static curl (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          DEPS_DIR=$PWD/deps

          # Build zlib static
          cd /tmp
          curl -sL https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz | tar xz
          cd zlib-1.3.1
          ./configure --static --prefix=$DEPS_DIR
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make install

          # On macOS, Homebrew OpenSSL is not in pkg-config path by default.
          SSL_ARG="--with-ssl"
          if [ "$(uname)" = "Darwin" ]; then
            SSL_ARG="--with-ssl=$(brew --prefix openssl@3)"
          fi

          # Build curl static (minimal — HTTPS only)
          cd /tmp
          curl -sL https://github.com/curl/curl/releases/download/curl-8_11_1/curl-8.11.1.tar.gz | tar xz
          cd curl-8.11.1
          ./configure \
            --prefix=$DEPS_DIR \
            --disable-shared --enable-static \
            --disable-ftp --disable-ldap --disable-dict \
            --disable-telnet --disable-tftp --disable-pop3 \
            --disable-imap --disable-smb --disable-smtp \
            --disable-gopher --disable-rtsp --disable-mqtt \
            --without-libpsl --without-brotli --without-zstd \
            --without-libidn2 --without-nghttp2 \
            $SSL_ARG --with-zlib=$DEPS_DIR
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make install

      - name: Build static curl (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $DEPS_DIR = "$PWD\deps"

          # Build zlib
          cd $env:TEMP
          Invoke-WebRequest -Uri "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz" -OutFile zlib.tar.gz
          tar xzf zlib.tar.gz
          cd zlib-1.3.1
          cmake -B build -DCMAKE_INSTALL_PREFIX="$DEPS_DIR" -DBUILD_SHARED_LIBS=OFF
          cmake --build build --config Release
          cmake --install build --config Release

          # Build curl
          cd $env:TEMP
          Invoke-WebRequest -Uri "https://github.com/curl/curl/releases/download/curl-8_11_1/curl-8.11.1.tar.gz" -OutFile curl.tar.gz
          tar xzf curl.tar.gz
          cd curl-8.11.1
          cmake -B build `
            -DCMAKE_INSTALL_PREFIX="$DEPS_DIR" `
            -DBUILD_SHARED_LIBS=OFF `
            -DCURL_USE_SCHANNEL=ON `
            -DHTTP_ONLY=ON `
            -DCURL_ZLIB=ON `
            -DZLIB_ROOT="$DEPS_DIR"
          cmake --build build --config Release
          cmake --install build --config Release

      - name: Vendor C sources
        run: node scripts/vendor.js

      - name: Build prebuild (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          DEPS_DIR: ${{ github.workspace }}/packages/node/deps
        run: |
          npx prebuildify --napi --strip \
            --cflags="-I$DEPS_DIR/include" \
            --ldflags="-L$DEPS_DIR/lib -lcurl -lssl -lcrypto -lz -framework Security -framework SystemConfiguration"

      - name: Build prebuild (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          DEPS_DIR: ${{ github.workspace }}/packages/node/deps
        run: |
          npx prebuildify --napi --strip \
            --cflags="-I$DEPS_DIR/include" \
            --ldflags="-L$DEPS_DIR/lib -lcurl -lssl -lcrypto -lz -static-libgcc"

      - name: Build prebuild (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $DEPS_DIR = "$PWD\deps"
          npx prebuildify --napi --strip `
            --cflags="/I$DEPS_DIR\include" `
            --ldflags="/LIBPATH:$DEPS_DIR\lib libcurl.lib zlib.lib ws2_32.lib advapi32.lib crypt32.lib normaliz.lib wldap32.lib"

      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/node/prebuilds/

  package:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: packages/node/prebuilds/
          pattern: prebuild-*
          merge-multiple: true

      - name: Vendor sources and data
        run: node scripts/vendor.js

      - name: List prebuilds
        run: find prebuilds -type f

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --access public
